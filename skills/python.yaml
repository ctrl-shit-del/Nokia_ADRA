description: Python 3 interpreter
check_cmd: python3 --version 2>&1
install:
  ubuntu:
  - sudo apt-get update -y
  - sudo apt-get install -y python3 python3-pip python3-venv
  rhel:
  - sudo yum install -y python3 python3-pip
verify_cmd: python3 --version 2>&1
learned_fixes:
- matched_error: 'E: Could not get lock /var/lib/dpkg/lock-frontend. It is held by
    process 46828 (apt-get)'
  os: ubuntu
  original_command: sudo apt-get install -y python3 python3-pip python3-venv
  fixed_command: sudo fuser -k /var/lib/dpkg/lock-frontend && sudo apt-get install
    -y python3 python3-pip python3-venv
  learned_at: '2026-07-01T16:40:56.336019'
  confidence: 1.0
