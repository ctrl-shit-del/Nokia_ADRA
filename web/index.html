<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ADRA Command Center</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.23.6/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            emerald: { 50: '#ecfdf5', 200: '#a7f3d0', 600: '#059669', 800: '#065f46' },
            teal: { 50: '#f0fdfa', 200: '#99f6e4', 600: '#0d9488', 800: '#115e59' },
            amber: { 50: '#fffbeb', 200: '#fde68a', 600: '#d97706', 800: '#92400e' },
            rose: { 50: '#fff1f2', 200: '#fecdd3', 600: '#e11d48', 800: '#9f1239' },
          },
          fontFamily: {
            sans: ['Inter', 'ui-sans-serif', 'system-ui', '-apple-system', 'sans-serif'],
            mono: ['JetBrains Mono', 'Fira Code', 'ui-monospace', 'monospace'],
          }
        }
      }
    }
  </script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap');
    
    body { font-family: 'Inter', sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', monospace; }
    
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 antialiased h-screen flex flex-col overflow-hidden">
  <div id="root" class="h-full flex flex-col"></div>

  <script type="text/babel" data-presets="react">
    const { useState, useEffect, useRef } = React;

    // --- Icons ---
    const IconCheck = ({className="w-4 h-4"}) => <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M5 13l4 4L19 7" /></svg>;
    const IconAlert = ({className="w-4 h-4"}) => <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" /></svg>;
    const IconX = ({className="w-4 h-4"}) => <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M6 18L18 6M6 6l12 12" /></svg>;
    const IconLoader = ({className="w-4 h-4 animate-spin"}) => <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>;
    const IconFlag = ({className="w-4 h-4"}) => <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M3 21v-4m0 0V5a2 2 0 012-2h6.5l1 1H21l-3 6 3 6h-8.5l-1-1H5a2 2 0 00-2 2zm9-13.5V9" /></svg>;
    const IconChevronDown = ({className="w-4 h-4"}) => <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M19 9l-7 7-7-7" /></svg>;
    const IconChevronRight = ({className="w-4 h-4"}) => <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M9 5l7 7-7 7" /></svg>;
    const IconUpload = ({className="w-4 h-4"}) => <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12" /></svg>;
    const IconServer = ({className="w-4 h-4"}) => <svg className={className} fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth={2}><path strokeLinecap="round" strokeLinejoin="round" d="M5 12h14M5 12a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2M5 12a2 2 0 00-2 2v4a2 2 0 002 2h14a2 2 0 002-2v-4a2 2 0 00-2-2m-2-4h.01M17 16h.01" /></svg>;

    // --- Shared Components ---
    const StatusBadge = ({ status }) => {
      let colors = "bg-slate-100 text-slate-600 border-slate-200";
      let text = status;
      if (status === 'Met' || status === 'success' || status === 'Succeeded') { colors = "bg-emerald-50 text-emerald-800 border-emerald-200"; text = "Met"; }
      if (status === 'success') text = "Success";
      if (status === 'Succeeded') text = "Succeeded";
      if (status === 'Insufficient') { colors = "bg-amber-50 text-amber-800 border-amber-200"; }
      if (status === 'Missing' || status === 'failed' || status === 'Failed') { colors = "bg-rose-50 text-rose-800 border-rose-200"; text = "Missing"; }
      if (status === 'failed') text = "Failed";
      if (status === 'Failed') text = "Failed";
      if (status === 'running' || status === 'Running') { colors = "bg-teal-50 text-teal-800 border-teal-200"; text = "Running"; }
      if (status === 'pending' || status === 'Pending') { colors = "bg-slate-50 text-slate-500 border-slate-200"; text = "Pending"; }
      
      return (
        <span className={`inline-flex items-center px-2 py-0.5 rounded text-xs font-medium border ${colors}`}>
          {text}
        </span>
      );
    };

    const StatusIcon = ({ status }) => {
      if (status === 'Met' || status === 'success') return <IconCheck className="w-4 h-4 text-emerald-600" />;
      if (status === 'Insufficient') return <IconAlert className="w-4 h-4 text-amber-600" />;
      if (status === 'Missing' || status === 'failed') return <IconX className="w-4 h-4 text-rose-600" />;
      if (status === 'running') return <IconLoader className="w-4 h-4 text-teal-600 animate-spin" />;
      return <div className="w-4 h-4 rounded-full border-2 border-slate-300"></div>;
    };

    // --- Tabs ---

    const RequirementsTab = () => {
      const [mode, setMode] = useState('profile');
      const [profiles, setProfiles] = useState([]);
      const [selectedProfile, setSelectedProfile] = useState('');
      const [selectedFile, setSelectedFile] = useState(null);
      const [customVersion, setCustomVersion] = useState('');
      const [reqs, setReqs] = useState({ hardware: {}, software: {}, flags: {} });
      const [loading, setLoading] = useState(false);

      useEffect(() => {
        fetch('/api/profiles').then(r => r.json()).then(d => {
          if (d.profiles && d.profiles.length > 0) {
            setProfiles(d.profiles);
            setSelectedProfile(d.profiles[0]);
          }
        });
        fetch('/api/state/requirements.json')
          .then(res => res.json())
          .then(data => {
            if (data.status === 'ok') setReqs(data.content);
          });
      }, []);

      const handleExtract = async () => {
        if (mode === 'profile') {
          setLoading(true);
          try {
            const res = await fetch('/api/requirements/run', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ context: { mode: 'profile', version: selectedProfile } })
            });
            const result = await res.json();
            if (result.tokens_used && window.updateTokens) window.updateTokens(result.tokens_used);
            if (result.status === 'ok') {
              const stateRes = await fetch('/api/state/requirements.json');
              const stateData = await stateRes.json();
              if (stateData.status === 'ok') setReqs(stateData.content);
            }
          } catch (err) {
            console.error("Failed to run requirements:", err);
          } finally {
            setLoading(false);
          }
        } else {
          if (!selectedFile) return;
          setLoading(true);
          const formData = new FormData();
          formData.append('file', selectedFile);
          if (mode === 'custom' && customVersion) {
            formData.append('save_profile', 'true');
            formData.append('version', customVersion);
          } else {
            formData.append('save_profile', 'false');
          }
          try {
            const res = await fetch('/api/requirements/upload', {
              method: 'POST',
              body: formData
            });
            const result = await res.json();
            if (result.tokens_used && window.updateTokens) window.updateTokens(result.tokens_used);
            if (result.status === 'ok') {
              const stateRes = await fetch('/api/state/requirements.json');
              const stateData = await stateRes.json();
              if (stateData.status === 'ok') setReqs(stateData.content);
            }
          } catch (err) {
            console.error("Upload failed:", err);
          } finally {
            setLoading(false);
          }
        }
      };

      const handleFileSelect = (e) => {
        const file = e.target.files[0];
        if (file) setSelectedFile(file);
      };

      return (
        <div className="flex flex-col h-full gap-4">
          <div className="bg-white border border-slate-200 rounded-lg shadow-sm p-4">
            <div className="flex border-b border-slate-200 mb-4">
              {['profile', 'upload', 'custom'].map(m => (
                <button 
                  key={m} 
                  onClick={() => setMode(m)}
                  className={`px-4 py-2 text-sm font-medium border-b-2 transition-colors ${mode === m ? 'border-teal-600 text-teal-700' : 'border-transparent text-slate-500 hover:text-slate-700'}`}
                >
                  {m === 'profile' ? 'Choose Version' : m === 'upload' ? 'Upload Manual' : 'Custom Version'}
                </button>
              ))}
            </div>

            <div className="flex items-end gap-4">
              {mode === 'profile' && (
                <div className="flex-1 max-w-xs">
                  <label className="block text-xs font-medium text-slate-500 mb-1">Select Profile</label>
                  <select 
                    className="w-full font-mono text-sm border border-slate-300 rounded px-3 py-2 bg-slate-50 focus:outline-none focus:border-teal-500"
                    value={selectedProfile}
                    onChange={(e) => setSelectedProfile(e.target.value)}
                  >
                    {profiles.map(p => <option key={p} value={p}>{p}</option>)}
                  </select>
                </div>
              )}
              {mode === 'upload' && (
                <div className="flex-1 border-2 border-dashed border-slate-300 rounded-lg p-6 flex flex-col items-center justify-center text-slate-500 bg-slate-50 relative cursor-pointer hover:bg-slate-100 transition-colors">
                  <IconUpload className="w-6 h-6 mb-2" />
                  <span className="text-sm">{selectedFile ? selectedFile.name : 'Click to browse or Drag and drop PDF/HTML'}</span>
                  <input type="file" onChange={handleFileSelect} className="absolute inset-0 w-full h-full opacity-0 cursor-pointer" />
                </div>
              )}
              {mode === 'custom' && (
                <div className="flex-1 flex gap-4">
                  <div className="flex-1 border-2 border-dashed border-slate-300 rounded-lg p-6 flex flex-col items-center justify-center text-slate-500 bg-slate-50 relative cursor-pointer hover:bg-slate-100 transition-colors">
                    <IconUpload className="w-6 h-6 mb-2" />
                    <span className="text-sm">{selectedFile ? selectedFile.name : 'Upload Manual'}</span>
                    <input type="file" onChange={handleFileSelect} className="absolute inset-0 w-full h-full opacity-0 cursor-pointer" />
                  </div>
                  <div className="flex-1 flex flex-col justify-end">
                    <label className="block text-xs font-medium text-slate-500 mb-1">Save Profile As</label>
                    <input type="text" placeholder="xyz26.5-custom" value={customVersion} onChange={e => setCustomVersion(e.target.value)} className="w-full font-mono text-sm border border-slate-300 rounded px-3 py-2 focus:outline-none focus:border-teal-500" />
                  </div>
                </div>
              )}
              <div className="pb-0.5">
                <button onClick={handleExtract} disabled={loading || (mode !== 'profile' && !selectedFile)} className="bg-slate-900 hover:bg-slate-800 disabled:bg-slate-400 text-white px-4 py-2 rounded text-sm font-medium transition-colors flex items-center gap-2">
                  {loading && <IconLoader className="w-4 h-4 text-white" />}
                  Extract Requirements
                </button>
              </div>
            </div>
          </div>

          <div className="bg-white border border-slate-200 rounded-lg shadow-sm flex-1 overflow-auto">
            <div className="p-4 border-b border-slate-200 bg-slate-50 flex justify-between items-center sticky top-0">
              <h3 className="font-semibold text-slate-800 text-sm">Extracted Requirements</h3>
            </div>
            <div className="p-0">
              <table className="w-full text-left border-collapse">
                <thead className="bg-slate-50 text-slate-500 text-xs uppercase sticky top-12 z-10 shadow-sm">
                  <tr>
                    <th className="px-4 py-2 font-medium border-b border-slate-200">Category</th>
                    <th className="px-4 py-2 font-medium border-b border-slate-200">Key</th>
                    <th className="px-4 py-2 font-medium border-b border-slate-200">Value</th>
                  </tr>
                </thead>
                <tbody className="text-sm divide-y divide-slate-100">
                  {reqs.hardware && Object.entries(reqs.hardware).map(([k, v]) => (
                    <tr key={k} className="hover:bg-slate-50/50">
                      <td className="px-4 py-2 text-slate-500">Hardware</td>
                      <td className="px-4 py-2 font-medium text-slate-700">{k}</td>
                      <td className="px-4 py-2 font-mono text-slate-900">{v}</td>
                    </tr>
                  ))}
                  {reqs.software && Object.entries(reqs.software).map(([k, v]) => (
                    <tr key={k} className="hover:bg-slate-50/50">
                      <td className="px-4 py-2 text-slate-500">Software</td>
                      <td className="px-4 py-2 font-medium text-slate-700 flex items-center gap-2">
                        {k}
                        {reqs.flags && reqs.flags[k] && (
                          <div className="group relative cursor-help flex items-center">
                            <IconFlag className="w-3.5 h-3.5 text-amber-500" />
                            <div className="absolute left-6 top-0 w-64 bg-slate-800 text-white text-xs p-2 rounded opacity-0 group-hover:opacity-100 pointer-events-none z-20">
                              {reqs.flags[k]}
                            </div>
                          </div>
                        )}
                      </td>
                      <td className="px-4 py-2 font-mono text-slate-900">{v}</td>
                    </tr>
                  ))}
                  {(!reqs.hardware || Object.keys(reqs.hardware).length === 0) && (
                    <tr><td colSpan="3" className="px-4 py-8 text-center text-slate-400 italic">No requirements extracted yet.</td></tr>
                  )}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    };

    const InventoryTab = ({ config }) => {
      const [mode, setMode] = useState('single');
      const [fleet, setFleet] = useState([]);
      const [fleetResults, setFleetResults] = useState([]);
      const [inventory, setInventory] = useState({ hardware: [], software: [] });
      const [loading, setLoading] = useState(false);
      const [viewedHost, setViewedHost] = useState(null);

      const fetchInventory = (targetHost) => {
        if (!targetHost) return;
        fetch('/api/state/inventory_' + targetHost + '.json')
          .then(res => res.json())
          .then(data => {
            if (data.status === 'ok') {
               setInventory(data.content);
               setViewedHost(targetHost);
            } else {
               setInventory({ hardware: [], software: [] });
            }
          })
          .catch(() => setInventory({ hardware: [], software: [] }));
      };

      const handleCsvUpload = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (evt) => {
          const text = evt.target.result;
          const lines = text.split('\n').filter(l => l.trim());
          const hosts = lines.map(line => {
            const parts = line.split(',');
            return { host: parts[0]?.trim(), username: parts[1]?.trim() || 'mystic', password: parts[2]?.trim() || '' };
          });
          setFleet(hosts);
        };
        reader.readAsText(file);
      };

      const runInventory = async () => {
        setLoading(true);
        setFleetResults([]);
        let targetHosts = mode === 'single' ? [{ host: config.host, username: config.user, password: config.pass }] : fleet;
        try {
          const res = await fetch('/api/inventory/run', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ context: { hosts: targetHosts } })
          });
          const result = await res.json();
          if (result.tokens_used && window.updateTokens) window.updateTokens(result.tokens_used);
          if (result.status === 'ok') {
            setFleetResults(result.results || []);
            if (mode === 'single') fetchInventory(config.host);
          } else {
            alert('Inventory failed: ' + (result.error || 'Unknown error'));
          }
        } catch (err) {
          console.error("Inventory failed:", err);
          alert('Inventory API call failed.');
        } finally {
          setLoading(false);
        }
      };

      const allItems = [...(inventory.hardware || []), ...(inventory.software || [])];
      const metCount = allItems.filter(i => i.status === 'Met').length;

      return (
        <div className="flex flex-col h-full gap-4">
          <div className="bg-white border border-slate-200 rounded-lg shadow-sm p-4">
            <div className="flex border-b border-slate-200 mb-4">
              {['single', 'bulk'].map(m => (
                <button 
                  key={m} 
                  onClick={() => setMode(m)}
                  className={`px-4 py-2 text-sm font-medium border-b-2 transition-colors ${mode === m ? 'border-teal-600 text-teal-700' : 'border-transparent text-slate-500 hover:text-slate-700'}`}
                >
                  {m === 'single' ? 'Single Host' : 'Bulk Upload (CSV)'}
                </button>
              ))}
            </div>

            <div className="flex gap-4 items-end">
              {mode === 'single' ? (
                <div className="flex-1 text-sm text-slate-500 py-2">
                  Target: <span className="font-mono text-slate-800">{config.user}@{config.host}</span>
                </div>
              ) : (
                <div className="flex-1 border-2 border-dashed border-slate-300 rounded-lg p-6 flex flex-col items-center justify-center text-slate-500 bg-slate-50 relative cursor-pointer hover:bg-slate-100 transition-colors">
                  <IconUpload className="w-6 h-6 mb-2" />
                  <span className="text-sm">{fleet.length > 0 ? `Loaded ${fleet.length} hosts` : 'Upload CSV (Host, User, Password)'}</span>
                  <input type="file" accept=".csv" onChange={handleCsvUpload} className="absolute inset-0 w-full h-full opacity-0 cursor-pointer" />
                </div>
              )}
              <div className="pb-0.5">
                <button 
                  onClick={runInventory}
                  disabled={loading || (mode === 'bulk' && fleet.length === 0)}
                  className="bg-slate-900 hover:bg-slate-800 disabled:bg-slate-400 text-white px-4 py-2 rounded text-sm font-medium transition-colors flex items-center gap-2 h-[38px]"
                >
                  {loading && <IconLoader className="w-4 h-4 text-white" />}
                  Run Inventory
                </button>
              </div>
            </div>
          </div>

          {mode === 'bulk' && fleetResults.length > 0 && (
            <div className="bg-white border border-slate-200 rounded-lg shadow-sm flex flex-col mb-4 max-h-48 overflow-auto">
              <table className="w-full text-left border-collapse whitespace-nowrap">
                <thead className="bg-slate-50 text-slate-500 text-[11px] uppercase tracking-wider sticky top-0 z-10 shadow-sm">
                  <tr>
                    <th className="px-4 py-2 font-medium border-b border-slate-200">Host</th>
                    <th className="px-4 py-2 font-medium border-b border-slate-200">Status</th>
                    <th className="px-4 py-2 font-medium border-b border-slate-200">Action</th>
                  </tr>
                </thead>
                <tbody className="text-[13px] divide-y divide-slate-100">
                  {fleetResults.map((res, i) => (
                    <tr key={i} className="hover:bg-slate-50/50">
                      <td className="px-4 py-2 font-mono text-slate-800">{res.host || fleet[i]?.host}</td>
                      <td className="px-4 py-2 text-slate-600">{res.status === 'ok' ? <span className="text-teal-600">Success</span> : <span className="text-rose-600">Failed: {res.error}</span>}</td>
                      <td className="px-4 py-2">
                         {res.status === 'ok' && (
                           <button onClick={() => fetchInventory(res.host || fleet[i]?.host)} className="text-teal-600 font-medium text-xs">View Gap Analysis</button>
                         )}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}

          <div className="bg-white border border-slate-200 rounded-lg shadow-sm flex-1 flex flex-col overflow-hidden">
            <div className="p-3 border-b border-slate-200 bg-slate-50 flex justify-between items-center shrink-0">
              <h3 className="font-semibold text-slate-800 text-sm">Gap Analysis {viewedHost && `(${viewedHost})`}</h3>
              <div className="flex gap-2 items-center">
                 <button onClick={() => fetchInventory(viewedHost || config.host)} className="text-xs text-teal-600 hover:text-teal-800">Refresh</button>
                 <div className="text-sm text-slate-600 bg-white border border-slate-200 px-3 py-1 rounded-full shadow-sm">
                   <span className="font-medium text-slate-900">{metCount}</span> of {allItems.length} requirements met
                 </div>
              </div>
            </div>
            <div className="overflow-auto flex-1">
              <table className="w-full text-left border-collapse whitespace-nowrap">
                <thead className="bg-slate-50 text-slate-500 text-[11px] uppercase tracking-wider sticky top-0 z-10 shadow-sm">
                  <tr>
                    <th className="px-4 py-2 font-medium border-b border-slate-200 w-10"></th>
                    <th className="px-4 py-2 font-medium border-b border-slate-200">Item</th>
                    <th className="px-4 py-2 font-medium border-b border-slate-200">Required</th>
                    <th className="px-4 py-2 font-medium border-b border-slate-200">Found</th>
                    <th className="px-4 py-2 font-medium border-b border-slate-200">Status</th>
                  </tr>
                </thead>
                <tbody className="text-[13px] divide-y divide-slate-100">
                  {allItems.map((item, i) => (
                    <tr key={i} className="hover:bg-slate-50/50">
                      <td className="px-4 py-2 text-center">
                        <StatusIcon status={item.status} />
                      </td>
                      <td className="px-4 py-2 font-medium text-slate-800">{item.item}</td>
                      <td className="px-4 py-2 font-mono text-slate-600">{item.required}</td>
                      <td className={`px-4 py-2 font-mono ${item.status === 'Missing' ? 'text-slate-400' : 'text-slate-900'}`}>{item.found}</td>
                      <td className="px-4 py-2">
                        <StatusBadge status={item.status} />
                      </td>
                    </tr>
                  ))}
                  {allItems.length === 0 && (
                    <tr>
                      <td colSpan="5" className="px-4 py-8 text-center text-slate-400 italic">No inventory data. Run requirements extraction first, then inventory.</td>
                    </tr>
                  )}
                </tbody>
              </table>
            </div>
          </div>
        </div>
      );
    };

    const PackagesTab = ({ config }) => {
      const [inventory, setInventory] = useState({ hardware: [], software: [] });
      const [loading, setLoading] = useState(false);
      const [acknowledged, setAcknowledged] = useState(false);

      const fetchInventory = () => {
        fetch('/api/state/inventory.json')

    const InstallerTab = ({ config }) => {
      const [steps, setSteps] = useState([]);
      const [loading, setLoading] = useState(false);
      const [expanded, setExpanded] = useState({});
      const [errorMsg, setErrorMsg] = useState(null);
      
      const toggle = (id) => setExpanded(prev => ({...prev, [id]: !prev[id]}));

      const runInstaller = async () => {
        setLoading(true);
        setErrorMsg(null);
        try {
          const { host, user: username, pass: password, model } = config;

          const res = await fetch('/api/installer/run', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ context: { host, username, password, use_llm, model } })
          });
          const result = await res.json();
          if (result.status === 'ok') {
             if (result.steps) {
                setSteps(result.steps);
             }
             if (result.error) {
                setErrorMsg(result.error);
             }
          } else {
             setErrorMsg(result.error || "Installation failed.");
             if (result.steps) {
                 setSteps(result.steps);
             }
          }
        } catch (err) {
          console.error("Installer failed:", err);
          setErrorMsg("Installer API call failed.");
        } finally {
          setLoading(false);
        }
      };

      return (
        <div className="bg-white border border-slate-200 rounded-lg shadow-sm h-full flex flex-col overflow-hidden">

                  {loading && <IconLoader className="w-4 h-4 text-white" />}

               </button>
            </div>
          </div>
          <div className="overflow-auto flex-1 p-4 bg-slate-50/50">
            <div className="space-y-4">
              {errorMsg && (
                 <div className="bg-rose-50 border border-rose-200 rounded p-4 text-rose-800 text-sm">
                   <strong>Error: </strong> {errorMsg}
                 </div>
              )}

                <div key={idx} className="bg-white border border-slate-200 rounded-md shadow-sm overflow-hidden">
                  <div 
                    className={`px-4 py-3 flex items-center gap-3 cursor-pointer select-none ${step.status === 'failed' ? 'bg-rose-50/30' : ''}`}
                    onClick={() => step.attempts && toggle(idx)}
                  >
                    <div className="shrink-0 w-5 h-5 flex items-center justify-center">
                      <StatusIcon status={step.status} />
                    </div>
                    <span className="font-medium text-sm text-slate-800 flex-1">{step.name || step.action}</span>
                    <span className="shrink-0"><StatusBadge status={step.status} /></span>
                    {step.attempts && (
                      <span className="shrink-0 text-slate-400">
                        {expanded[idx] ? <IconChevronDown /> : <IconChevronRight />}
                      </span>
                    )}
                  </div>
                  
                  {step.attempts && expanded[idx] && (
                    <div className="border-t border-slate-200 bg-slate-50 p-4 space-y-4">
                      {step.attempts.map((att, i) => (
                        <div key={i} className="relative pl-6 border-l-2 border-slate-200">
                          <div className="absolute -left-[5px] top-1.5 w-2 h-2 rounded-full bg-slate-400 ring-4 ring-slate-50"></div>
                          <div className="text-xs font-semibold text-slate-500 mb-2 uppercase tracking-wide">Attempt {att.attempt || (i+1)}</div>
                          <div className="bg-[#0F172A] rounded p-3 mb-2 overflow-x-auto shadow-inner">
                            <div className="font-mono text-[12px] text-teal-400 mb-1">$ {att.command}</div>
                            <div className={`font-mono text-[12px] whitespace-pre-wrap ${att.output && att.output.includes('Error') ? 'text-rose-400' : 'text-slate-300'}`}>{att.output || 'No output'}</div>
                          </div>
                          <div className="bg-indigo-50 border border-indigo-100 rounded p-3 text-sm flex gap-3 items-start">
                            <span className="shrink-0 mt-0.5">🧠</span>
                            <div>
                              <div className="font-semibold text-indigo-900 text-xs uppercase mb-0.5">Agent Diagnosis</div>
                              <div className="text-indigo-800 leading-relaxed">{att.diagnosis || 'None'}</div>
                            </div>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              ))}
              {steps.length === 0 && !loading && !errorMsg && (
                <div className="text-center py-12 text-slate-400 italic">No execution data yet. Click Run Installer to begin.</div>
              )}
            </div>
          </div>
        </div>
      );
    };

    const ReportTab = () => {

          .then(res => res.json())

          </div>
          <div className="overflow-auto flex-1 p-6 font-mono text-sm whitespace-pre-wrap bg-slate-50 text-slate-800">
             {report || "No report available yet. Complete an installation first."}

    const TerminalTab = ({ logs, config }) => {
      const [cmd, setCmd] = useState('');
      const { host, user, pass } = config;

      const [loading, setLoading] = useState(false);
      const endRef = useRef(null);

        e.preventDefault();

        setLoading(true);
        try {
          await fetch('/api/terminal/run', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ context: { host, username: user, password: pass, command: cmd } })
          });
          setCmd('');
        } catch(err) {
          console.error(err);
        } finally {
          setLoading(false);
        }

             </form>

    // --- Main App ---
    
    const App = () => {
      const [activeTab, setActiveTab] = useState('requirements');
      const [tokens, setTokens] = useState({ prompt: 0, completion: 0, total: 0 });
      const [logs, setLogs] = useState("");
      const [runTime, setRunTime] = useState(0);
      const timerRef = React.useRef(null);
      const [models, setModels] = useState([]);
      
      const [config, setConfig] = useState({
        llmHost: '192.168.68.17',
        llmPort: '8080',
        llmCommand: 'llama-server -m /home/mystic/models/qwen25/qwen2.5-7b-instruct-q5_k_m-00001-of-00002.gguf -t 16 -c 8192 --port 8080',
        host: localStorage.getItem('adra_host') || '192.168.68.17',
        sshPort: '22',
        user: localStorage.getItem('adra_user') || 'ubuntu',
        pass: localStorage.getItem('adra_pass') || 'ubuntu',
        model: 'mock-model',
        scope: 'CC-25.12-Simpleinstallation',
        timeout: '29940',
        useLlm: true
      });

      const updateConfig = (k, v) => setConfig(prev => ({...prev, [k]: v}));

      useEffect(() => {
        localStorage.setItem('adra_host', config.host);
        localStorage.setItem('adra_user', config.user);
        localStorage.setItem('adra_pass', config.pass);
      }, [config.host, config.user, config.pass]);

      useEffect(() => {
        fetch(`/api/models?host=${config.llmHost}&port=${config.llmPort}`).then(r => r.json()).then(d => {
          if (d.models && d.models.length > 0) {
            setModels(d.models);
            setConfig(prev => ({ ...prev, model: d.models.includes('gemma4:e2b') ? 'gemma4:e2b' : d.models[0] }));
          } else {
            setModels([]);
          }
        }).catch(e => console.error("Error fetching models:", e));
      }, [config.llmHost, config.llmPort]);

      const startLlmServer = async () => {
        try {
           const res = await fetch('/api/llm/start', { 
               method: 'POST',
               headers: { 'Content-Type': 'application/json' },
               body: JSON.stringify({ context: { command: config.llmCommand } })
           });
           const data = await res.json();
           if (data.status === 'ok') {
               alert("LLM Server starting...");
               // Give it a moment to start up then refresh models
               setTimeout(() => setConfig(prev => ({...prev})), 2000);
           } else {
               alert("Failed to start LLM: " + data.error);
           }
        } catch (err) {
           console.error("Error starting LLM", err);
        }
      };


      useEffect(() => {
        const originalFetch = window.fetch;
        let activeRequests = 0;
        let start = 0;

        window.fetch = async function(...args) {
          // Exclude state polling or minor endpoints from the timer if needed
          const url = typeof args[0] === 'string' ? args[0] : args[0].url;
          if (url.includes('/api/state/') || url.includes('/api/profiles')) {
             return originalFetch.apply(this, args);
          }

          activeRequests++;
          if (activeRequests === 1) {
            start = Date.now();
            setRunTime(0);
            timerRef.current = setInterval(() => {
              setRunTime(Date.now() - start);
            }, 100);
          }
          try {
            return await originalFetch.apply(this, args);
          } finally {
            activeRequests--;
            if (activeRequests === 0) {
              clearInterval(timerRef.current);
            }
          }
        };

        return () => {
          window.fetch = originalFetch;
          clearInterval(timerRef.current);
        };
      }, []);

      useEffect(() => {
        window.updateTokens = (usage) => {
          setTokens({
            prompt: usage.prompt || 0,
            completion: usage.completion || 0,
            total: usage.total || 0
          });
        };
        const source = new EventSource('/api/events');
        source.addEventListener('tokens', event => {
          try {
            const usage = JSON.parse(event.data);
            window.updateTokens(usage);
          } catch(e){}
        });
        source.addEventListener('log', event => {
          try {
            const data = JSON.parse(event.data);
            if (data.log) {
              setLogs(prev => (prev + data.log).slice(-20000));
            }
          } catch(e){}
        });
        return () => source.close();
      }, []);

      const tabs = [
        { id: 'requirements', label: 'Requirements' },
        { id: 'inventory', label: 'Inventory' },
        { id: 'packages', label: 'Packages' },
        { id: 'installer', label: 'Installer' },
        { id: 'report', label: 'Fleet Report' },
        { id: 'terminal', label: 'Terminal' }

              {tabs.map(tab => (
                <button
                  key={tab.id}
                  onClick={() => setActiveTab(tab.id)}
                  className={`px-4 py-2 text-sm font-medium border-b-2 transition-colors ${
                    activeTab === tab.id 
                      ? 'border-emerald-400 text-white bg-slate-800 rounded-t' 
                      : 'border-transparent text-slate-400 hover:text-slate-200 hover:bg-slate-800/50 rounded-t'
                  }`}
                >
                  {tab.label}
                </button>
              ))}
            </nav>
          </header>

          
          <main className="flex-1 overflow-hidden flex max-w-[1600px] mx-auto w-full">
            {/* Sidebar */}
            <aside className="w-64 bg-slate-50 border-r border-slate-200 flex flex-col shrink-0 overflow-y-auto">

                <h3 className="text-sm font-semibold text-slate-700 mb-3">LLM Server</h3>
                <div className="space-y-3">
                  <div>
                    <label className="block text-xs font-medium text-slate-500 mb-1">Local Startup Command</label>
                    <textarea value={config.llmCommand} onChange={e => updateConfig('llmCommand', e.target.value)} className="w-full text-xs font-mono border border-slate-300 rounded px-2 py-1.5 focus:border-teal-500 focus:outline-none h-16 resize-none" />
                  </div>
                  <div className="flex gap-2">
                    <div className="flex-1">
                      <label className="block text-xs font-medium text-slate-500 mb-1">LLM Host</label>
                      <input type="text" value={config.llmHost} onChange={e => updateConfig('llmHost', e.target.value)} className="w-full text-sm border border-slate-300 rounded px-2 py-1.5 focus:border-teal-500 focus:outline-none" />
                    </div>
                    <div className="flex-1">
                      <label className="block text-xs font-medium text-slate-500 mb-1">LLM Port</label>
                      <input type="text" value={config.llmPort} onChange={e => updateConfig('llmPort', e.target.value)} className="w-full text-sm border border-slate-300 rounded px-2 py-1.5 focus:border-teal-500 focus:outline-none" />
                    </div>
                  </div>
                  <div className="flex gap-2">
                    <button onClick={startLlmServer} className="flex-1 bg-teal-600 hover:bg-teal-700 text-white py-1.5 rounded text-xs font-medium transition-colors shadow-sm">Start LLM</button>
                    <button onClick={() => setConfig(prev => ({...prev}))} className="flex-1 bg-slate-100 hover:bg-slate-200 border border-slate-300 text-slate-700 py-1.5 rounded text-xs font-medium transition-colors">Refresh</button>
                  </div>
                </div>
              </div>

              <div className="p-4">
                <h3 className="text-sm font-semibold text-slate-700 mb-3">Connection</h3>
                <div className="space-y-3">
                  <div>
                    <label className="block text-xs font-medium text-slate-500 mb-1">Server IP / Hostname</label>
                    <input type="text" value={config.host} onChange={e => updateConfig('host', e.target.value)} className="w-full font-mono text-sm border border-slate-300 rounded px-2 py-1.5 focus:border-teal-500 focus:outline-none" />
                  </div>
                  <div>
                    <label className="block text-xs font-medium text-slate-500 mb-1">SSH Port</label>
                    <input type="text" value={config.sshPort} onChange={e => updateConfig('sshPort', e.target.value)} className="w-full text-sm border border-slate-300 rounded px-2 py-1.5 focus:border-teal-500 focus:outline-none" />
                  </div>
                  <div>
                    <label className="block text-xs font-medium text-slate-500 mb-1">Username</label>
                    <input type="text" value={config.user} onChange={e => updateConfig('user', e.target.value)} className="w-full font-mono text-sm border border-slate-300 rounded px-2 py-1.5 focus:border-teal-500 focus:outline-none" />
                  </div>
                  <div>
                    <label className="block text-xs font-medium text-slate-500 mb-1">Password</label>
                    <input type="password" value={config.pass} onChange={e => updateConfig('pass', e.target.value)} className="w-full text-sm border border-slate-300 rounded px-2 py-1.5 focus:border-teal-500 focus:outline-none" />
                  </div>
                  <div>
                    <label className="block text-xs font-medium text-slate-500 mb-1">LLM Model</label>
                    <select value={config.model} onChange={e => updateConfig('model', e.target.value)} className="w-full text-sm border border-slate-300 rounded px-2 py-1.5 bg-green-500 text-white font-medium focus:outline-none">
                      {models.map(m => <option key={m} value={m} className="bg-white text-slate-800">{m}</option>)}

                  </div>
                  <div>
                    <label className="block text-xs font-medium text-slate-500 mb-1">Collection Scope</label>
                    <select value={config.scope} onChange={e => updateConfig('scope', e.target.value)} className="w-full text-sm border border-slate-300 rounded px-2 py-1.5 focus:outline-none bg-white">
                      <option value="CC-25.12-Simpleinstallation">CC-25.12-Simpleinstallation</option>
                    </select>
                  </div>
                  <div>
                    <label className="block text-xs font-medium text-slate-500 mb-1">LLM Timeout (seconds)</label>
                    <input type="number" value={config.timeout} onChange={e => updateConfig('timeout', e.target.value)} className="w-full text-sm border border-slate-300 rounded px-2 py-1.5 focus:border-teal-500 focus:outline-none" />
                  </div>
                  <div className="pt-2 border-t border-slate-200 mt-4">
                     <label className="flex items-center gap-2 cursor-pointer text-sm font-medium text-slate-700">
                        <input type="checkbox" checked={config.useLlm} onChange={e => updateConfig('useLlm', e.target.checked)} className="rounded border-slate-300 text-teal-600 focus:ring-teal-500 w-4 h-4" />
                        Use LLM for Installation
                     </label>
                  </div>
                </div>
              </div>
            </aside>
            <div className="flex-1 p-6 overflow-hidden flex flex-col bg-slate-100">
              {activeTab === 'requirements' && <RequirementsTab config={config} />}
              {activeTab === 'inventory' && <InventoryTab config={config} />}
              {activeTab === 'packages' && <PackagesTab config={config} />}
              {activeTab === 'installer' && <InstallerTab config={config} />}
              {activeTab === 'report' && <ReportTab config={config} />}
              {activeTab === 'terminal' && <TerminalTab logs={logs} config={config} />}
            </div>
          </main>


          <footer className="bg-[#0F172A] text-slate-400 shrink-0 border-t border-slate-800 px-6 py-1.5 flex justify-between items-center text-xs font-mono">
            <div className="flex items-center gap-4">
              <span className="flex items-center gap-1.5 text-slate-500">
                <div className="w-1.5 h-1.5 rounded-full bg-teal-500/50"></div>
                Session Active
              </span>
            </div>
            <div className="flex items-center gap-6">
              <div className="flex gap-2 items-center bg-slate-800 px-3 py-1 rounded">
                <span className="text-slate-400 uppercase tracking-widest text-[10px]">Total Tokens</span>
                <span className={`w-14 text-right font-semibold ${tokens.total === 0 ? 'text-emerald-400' : 'text-amber-400'}`}>
                  {tokens.total}
                </span>
              </div>
              <div className="flex gap-2 items-center bg-slate-800 px-3 py-1 rounded">
                <span className="text-slate-400 uppercase tracking-widest text-[10px]">Time</span>
                <span className="text-amber-400 w-12 text-right font-semibold">
                  {runTime >= 60000 
                    ? `${Math.floor(runTime / 60000)}m ${((runTime % 60000) / 1000).toFixed(0)}s` 
                    : `${(runTime / 1000).toFixed(1)}s`}
                </span>
              </div>
            </div>
          </footer>
        </div>
      );
    };

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
